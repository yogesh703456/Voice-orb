# config/settings.yaml
# Central place for the knobs we discussed — nothing here should end up
# hardcoded in the pipeline modules.

wake_word:
  phrase: "hey jarvis"       # maps to OpenWakeWord hey_jarvis_v0.1
  sensitivity: 0.15

stt:
  model_size: "small.en"     # base.en / small.en — bigger = more accurate, slower
  compute_type: "int8"       # int8 keeps CPU load low on modest hardware
  silence_timeout_sec: 1.5   # how long to wait for silence before ending capture

tts:
  rate: 175                  # words per minute
  voice: "default"           # SAPI5 voice name, "default" = system default

orb:
  position: "bottom-right"   # bottom-right / bottom-left / top-right / top-left
  size_px: 80
  draggable: true
  remember_position: true    # persist dragged position across restarts

file_index:
  roots:                     # folders to index; keep this scoped, not the whole C:\
    - "~/Documents"
    - "~/Desktop"
    - "~/Downloads"
  refresh_on_startup: true
  watch_for_changes: true

startup:
  autostart: true
  run_hidden: true

# Optional LLM brain. When disabled, JARVIS behaves exactly as before
# (regex intents + executor only).
#
# provider: "ollama" (default -- LOCAL, no key, no internet) | "anthropic" |
#           "openai-compatible"
#
# Ollama (local):
#   model: "" auto-uses the ONE installed Ollama model; set it explicitly
#          (e.g. qwen3.5:4b) if several are installed. Needs the Ollama app
#          running (default endpoint http://127.0.0.1:11434).
#   think: the model's reasoning mode -- thorough but far too slow for a
#          voice assistant on CPU.
#   keep_alive_sec: how long the model stays resident in RAM between
#          requests (-1 = forever). After it expires, the next request
#          pays a cold model load.
#
# Cloud providers need a key in the environment or a git-ignored .env
# file (see .env.example). Keys are NEVER written in this file.
llm:
  enabled: true               # local Ollama brain is ON
  provider: "ollama"          # ollama (local) | anthropic | openai-compatible
  model: ""                   # empty = auto-use the single installed Ollama model
  base_url: ""                # empty = http://127.0.0.1:11434 (Ollama default)
  temperature: 0.0            # deterministic command parsing
  timeout_sec: 30.0           # hard cap on one LLM request (CPU inference is slower than cloud)
  max_tokens: 300             # decisions are tiny; no need for more
  keep_alive_sec: 3600        # keep the model resident 1h between requests
  think: false                # reasoning mode: OFF (too slow for voice on CPU)
  # api_key_env: "OLLAMA_API_KEY"   # only needed for key-secured Ollama proxies
